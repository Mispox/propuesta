<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta importante</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #da291c;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .container {
            background: white;
            padding: clamp(24px, 6vw, 40px) clamp(20px, 8vw, 60px);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: latido 3s ease-in-out infinite;
            width: 100%;
            max-width: 480px;
        }

        h1 {
            color: #000000;
            margin-bottom: 30px;
            font-size: clamp(1.4rem, 5vw, 2rem);
            line-height: 1.3;
        }

        p {
            color: #000000;
            font-size: clamp(1rem, 3.5vw, 1.15rem);
        }

        .botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        button {
            font-family: inherit;
            font-size: clamp(16px, 4vw, 20px);
            padding: 12px 24px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #000000;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        #btnSi {
            background-color: #28a745;
            box-shadow: 0 4px 0 #1e7e34;
        }

        #btnNo {
            background-color: #f1c40f;
            box-shadow: 0 4px 0 #b8960c;
            z-index: 999;
        }

        .imagen-final {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-top: 15px;
            max-height: 250px;
        }

        @media (max-width: 400px) {
            .container {
                padding: 24px 18px;
            }

            button {
                width: 100%;
                margin: 6px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="contenedor">
        <h1>¿Querés ser mi novia? ❤️</h1>
        <div class="botones">
            <button id="btnSi">Sí</button>
            <button id="btnNo">No</button>
        </div>
    </div>
    <script>
        const btnNo = document.getElementById('btnNo');
        const btnSi = document.getElementById('btnSi');
        const contenedor = document.getElementById('contenedor');

        function moverBtnNo() {
            if (btnNo.parentNode !== document.body) {
                document.body.appendChild(btnNo);
            }

            btnNo.style.position = 'fixed';

            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 20);

            btnNo.style.left = `${Math.max(10, x)}px`;
            btnNo.style.top = `${Math.max(10, y)}px`;
        }

        const tieneMouse = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

        if (tieneMouse) {
            btnNo.addEventListener('mouseenter', moverBtnNo);
        } else {
            btnNo.addEventListener('touchstart', (e) => {
                e.preventDefault();
                moverBtnNo();
            }, { passive: false });
        }

        btnSi.addEventListener('click', () => {
            contenedor.innerHTML = `
                <h1>¡Sabía que ibas a decir que sí! 🥰</h1>
                <p>te amo mucho</p>
                <img src="marx.png" alt="" class="imagen-final">
            `;

            btnNo.remove();
        });
    </script>
</body>
</html>
